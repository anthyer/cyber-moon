[project]
name = "cybermoon"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pulumi>=3.0.0,<4.0.0",
    "pulumi-aws>=7.0.0,<8.0.0",
]

[dependency-groups]
dev = [
    "boto3>=1.34",
    "moto[dynamodb]>=5.0",
    "pyjwt[crypto]>=2.9",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
# As Lambdas se importam pelo nome solto (import utils), como dentro da AWS.
pythonpath = ["lambdas"]

[tool.ruff]
line-length = 110
src = ["lambdas"]

[tool.ruff.lint]
select = ["E", "F", "I"]
